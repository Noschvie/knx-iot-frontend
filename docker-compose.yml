services:
  knx-iot-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - API_BASE=${API_BASE}
      - WS_BASE=${WS_BASE}
      # Use host timezone for logging consistency
      - TZ=${TZ:-Europe/Vienna}
      # Syslog server configuration (for UDP forwarding via bridge)
      - SYSLOG_HOST=${SYSLOG_HOST}
      - SYSLOG_PORT=${SYSLOG_PORT}
      # Log bridge service port
      - LOG_BRIDGE_PORT=9514
    ports:
      - "8080:80"
      - "9514:9514"
    restart: unless-stopped
