services:
  knx-iot-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - API_BASE=${API_BASE}
      - WS_BASE=${WS_BASE}
      # Use host timezone for logging consistency (e.g., Europe/Berlin, America/New_York, UTC)
      # Default to UTC if not specified - override in .env file or command line
      - TZ=${TZ:-Europe/Vienna}
    ports:
      - "8080:80"
    restart: unless-stopped
