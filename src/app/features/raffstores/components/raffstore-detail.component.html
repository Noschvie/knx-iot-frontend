<div class="detail-modal">
  <!-- Header -->
  <div class="detail-header">
    <div class="header-content">
      <h2 class="title">{{ raffstore.name }}</h2>
      <p class="location">{{ raffstore.floor === 'EG' ? 'Erdgeschoss' : 'Obergeschoss' }}</p>
    </div>
    <div class="header-right">
      <span *ngIf="raffstore.autoMode" class="badge">Automatik</span>
      <button class="close-btn" (click)="close()">✕</button>
    </div>
  </div>

  <!-- Quick Commands: Auf / Stopp / Zu -->
  <div class="button-row">
    <button class="move-btn move-up" (click)="moveUp()">
      Auf
    </button>
    <button class="move-btn move-stop" (click)="moveStop()">
      Stopp
    </button>
    <button class="move-btn move-down" (click)="moveDown()">
      Zu
    </button>
  </div>

  <!-- Status feedback (Rückmeldung vom KNX-Backend) -->
  <div class="status-section"
       *ngIf="raffstore.statusPositionPercent != null || raffstore.statusLamellaPercent != null || raffstore.isEndTop || raffstore.isEndBottom">
    <label class="status-label">Rückmeldung</label>

    <div class="status-bar-row" *ngIf="raffstore.statusPositionPercent != null">
      <span class="status-name">Position</span>
      <div class="status-track">
        <div class="status-fill" [style.width.%]="raffstore.statusPositionPercent"></div>
      </div>
      <span class="status-pct">{{ raffstore.statusPositionPercent }}%</span>
    </div>

    <div class="status-bar-row" *ngIf="raffstore.statusLamellaPercent != null">
      <span class="status-name">Lamelle</span>
      <div class="status-track">
        <div class="status-fill status-fill-lamella" [style.width.%]="raffstore.statusLamellaPercent"></div>
      </div>
      <span class="status-pct">{{ raffstore.statusLamellaPercent }}%</span>
    </div>

    <div class="status-end-row" *ngIf="raffstore.isEndTop || raffstore.isEndBottom">
      <span class="end-badge" *ngIf="raffstore.isEndTop" title="Endlage oben">▲ Endlage oben</span>
      <span class="end-badge" *ngIf="raffstore.isEndBottom" title="Endlage unten">▼ Endlage unten</span>
    </div>
  </div>

  <!-- Height Stepper -->
  <div class="stepper-section">
    <label class="stepper-label">Höhe</label>
    <div class="stepper-buttons">
      <button
        *ngFor="let step of heightSteps"
        class="step-btn"
        [class.active]="raffstore.heightStep === step.value"
        (click)="setHeight(step.value)"
      >
        {{ step.label }}
      </button>
    </div>
  </div>

  <!-- Angle Stepper -->
  <div class="stepper-section">
    <label class="stepper-label">Lamellenwinkel</label>
    <div class="stepper-buttons stepper-3col">
      <button
        *ngFor="let step of angleSteps"
        class="step-btn"
        [class.active]="raffstore.angleStep === step.value"
        (click)="setAngle(step.value)"
      >
        {{ step.label }}
      </button>
    </div>
  </div>

  <!-- Favorites -->
  <div class="favorites-section">
    <label class="favorites-label">Favoriten</label>
    <div class="favorites-grid">
      <button
        *ngFor="let fav of favorites"
        class="favorite-btn"
        (click)="applyFavorite(fav)"
      >
        {{ fav.label }}
      </button>
    </div>
  </div>

  <!-- Footer: Auto Mode Toggle -->
  <div class="detail-footer">
    <button class="auto-toggle" (click)="toggleAutoMode()">
      <span class="icon">{{ raffstore.autoMode ? '☀' : '✋' }}</span>
      {{ raffstore.autoMode ? 'Automatik AN' : 'Manuell' }}
    </button>
  </div>
</div>
