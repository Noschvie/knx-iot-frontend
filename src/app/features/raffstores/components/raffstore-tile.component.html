<div class="tile" (click)="openDetail()" role="button" tabindex="0">
  <!-- Header: Name + Icons -->
  <div class="tile-header">
    <span class="tile-name">{{ raffstore.name }}</span>
    <div class="tile-icons">
      <!-- Movement Indicator -->
      <span *ngIf="raffstore.isMoving" class="icon icon-moving" title="Bewegung">↕</span>
      <span *ngIf="raffstore.isEndTop" class="end-badge" title="Endlage oben">▲ Oben</span>
      <span *ngIf="raffstore.isEndBottom" class="end-badge" title="Endlage unten">▼ Unten</span>
      <!-- Auto Mode Badge -->
      <span *ngIf="raffstore.autoMode && !raffstore.isMoving" class="icon icon-auto" title="Automatik aktiv">☀</span>
    </div>
  </div>

  <div class="feedback-row" [title]="raffstore.statusPositionPercent != null ? 'Ist-Position ' + raffstore.statusPositionPercent + '%' : 'Keine Positionsrückmeldung'">
    <span class="feedback-label">Position</span>
    <div class="feedback-track">
      <div class="feedback-fill position-fill"
           [style.width.%]="raffstore.statusPositionPercent ?? 0"></div>
    </div>
    <span class="feedback-value">{{ raffstore.statusPositionPercent != null ? raffstore.statusPositionPercent + '%' : '—' }}</span>
  </div>

  <div class="feedback-row" [title]="raffstore.statusLamellaPercent != null ? 'Lamellenrückmeldung ' + raffstore.statusLamellaPercent + '%' : 'Keine Lamellenrückmeldung'">
    <span class="feedback-label">Lamelle</span>
    <div class="feedback-track">
      <div class="feedback-fill lamella-fill"
           [style.width.%]="raffstore.statusLamellaPercent ?? 0"></div>
    </div>
    <span class="feedback-value">{{ raffstore.statusLamellaPercent != null ? raffstore.statusLamellaPercent + '%' : '—' }}</span>
  </div>
</div>
