<div class="tile" (click)="openDetail()" role="button" tabindex="0">
  <!-- Header: Name + Icons -->
  <div class="tile-header">
    <span class="tile-name">{{ raffstore.name }}</span>
    <div class="tile-icons">
      <!-- Movement Indicator -->
      <span *ngIf="raffstore.isMoving" class="icon icon-moving" title="Bewegung">
        ↕
      </span>
      <!-- Auto Mode Badge -->
      <span *ngIf="raffstore.autoMode && !raffstore.isMoving" class="icon icon-auto" title="Automatik aktiv">
        ☀
      </span>
    </div>
  </div>

  <!-- Height Bar -->
  <div class="bar-container">
    <div class="bar-background">
      <div class="bar-fill" [style.height.%]="getHeightPercent()"></div>
    </div>
  </div>

  <!-- Status Line -->
  <div class="tile-status">
    {{ HEIGHT_STEPS[raffstore.heightStep] }} · {{ ANGLE_STEPS[raffstore.angleStep] }}
  </div>
</div>
