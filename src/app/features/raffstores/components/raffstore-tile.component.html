<div class="tile" (click)="openDetail()" role="button" tabindex="0">
  <!-- Header: Name + Icons -->
  <div class="tile-header">
    <span class="tile-name">{{ raffstore.name }}</span>
    <div class="tile-icons">
      <!-- Movement Indicator -->
      <span *ngIf="raffstore.isMoving" class="icon icon-moving" [title]="'raffstore.movement' | translate">↕</span>
      <span *ngIf="raffstore.isEndTop"
            class="end-icon"
            role="img"
            [title]="'raffstore.endTop' | translate"
            [attr.aria-label]="'raffstore.endTop' | translate">▲</span>
      <span *ngIf="raffstore.isEndBottom"
            class="end-icon"
            role="img"
            [title]="'raffstore.endBottom' | translate"
            [attr.aria-label]="'raffstore.endBottom' | translate">▼</span>
      <!-- Auto Mode Badge -->
      <span *ngIf="raffstore.autoMode" class="icon icon-auto" [title]="'raffstore.automationActive' | translate">☀</span>
    </div>
  </div>

  <div class="feedback-row" [title]="'raffstore.positionFeedback' | translate">
    <span class="feedback-label">{{ 'raffstore.position' | translate }}</span>
    <div class="feedback-track">
      <div class="feedback-fill position-fill"
           [style.width.%]="raffstore.statusPositionPercent ?? 0"></div>
    </div>
    <span class="feedback-value">{{ raffstore.statusPositionPercent != null ? raffstore.statusPositionPercent + '%' : '—' }}</span>
  </div>

  <div class="feedback-row" [title]="'raffstore.lamellaFeedback' | translate">
    <span class="feedback-label">{{ 'raffstore.lamella' | translate }}</span>
    <div class="feedback-track">
      <div class="feedback-fill lamella-fill"
           [style.width.%]="raffstore.statusLamellaPercent ?? 0"></div>
    </div>
    <span class="feedback-value">{{ raffstore.statusLamellaPercent != null ? raffstore.statusLamellaPercent + '%' : '—' }}</span>
  </div>
</div>
