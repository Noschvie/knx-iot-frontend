<div class="locations-container">
  <h2>Standorte</h2>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading">
    <p>Laden...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !error && locations.length === 0" class="empty">
    <p>Keine Standorte verfügbar</p>
  </div>

  <!-- Locations Table -->
  <div *ngIf="!loading && !error && locations.length > 0" class="table-wrapper">
    <table class="locations-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Typ</th>
          <th>Beschreibung</th>
          <th>Geräte</th>
          <th>Datenpunkte</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let location of locations" class="location-row">
          <td class="location-name">{{ location.title }}</td>
          <td class="location-type">
            <span class="type-badge" [attr.data-type]="location.locationType">
              {{ getLocationTypeLabel(location.locationType) }}
            </span>
          </td>
          <td class="location-description">{{ location.description || '-' }}</td>
          <td class="location-devices">
            {{ location.deviceIds?.length || 0 }}
          </td>
          <td class="location-datapoints">
            {{ location.datapointIds?.length || 0 }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
