events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep Nginx errors visible without logging every HTTP request.
    access_log off;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Lightweight health endpoint
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # Proxy for Syslog Bridge Service
        location /syslog {
            access_log off;
            proxy_pass http://127.0.0.1:9514;
            proxy_http_version 1.1;
            proxy_set_header Content-Type application/json;
            proxy_buffering off;

            # Add CORS headers for browser requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            if ($request_method = 'OPTIONS') {
              return 204;
            }
        }

        # Proxy API + config requests to the BFF (same-origin)
        location /api/ {
            proxy_pass http://bff:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Server-Sent Events (raffstore events) need unbuffered streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Suppress repetitive access-log entries for the SPA's /registers route.
        location = /registers {
            access_log off;
            try_files $uri $uri/ /index.html;
        }

        # BFF info endpoint
        location = /info {
            proxy_pass http://bff:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy WebSocket (messaging) to the BFF, which forwards to the gateway
        location /messaging/ {
            proxy_pass http://bff:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Config files (JSON) - no cache, always serve fresh
        location ~* \.json$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Type "application/json";
        }

        # SPA: Route all requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}